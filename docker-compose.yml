# Flare's v1 distribution story (Planning.md: "least overhead to try" / "docker compose
# up for v1"). `docker compose up` alone brings up the whole stack - ClickHouse, Redis,
# Flare.Ingest (OTLP receiver), Flare.Api (query + live-tail), Flare.Dashboard - with
# working defaults for every credential and port. Copy .env.example to .env to
# override any of them (see that file for what each one does and why).
#
# This is the non-Aspire counterpart to Flare.AppHost/Program.cs - same two backing
# store services (ClickHouse, Redis), same connection-string shape, same ClickHouse
# init-mount trick (see db/clickhouse/README.md), deliberately kept in sync with it.
# Auth's identity store (Users/Sessions/IngestApiKeys) is a third thing `ingest`/`api`
# share, but deliberately isn't a fourth service/container - it's embedded SQLite on a
# plain shared volume (identity-data, below) mounted directly into both processes.
# Unlike Flare.AppHost, nothing here is proxied or dynamically ported: every port below
# is fixed, because this is meant to be pointed at directly (by OTLP clients, by you
# opening the dashboard), not driven through Aspire's dashboard/service discovery.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    # flare.resource/flare.role are this stack's own identity/relationship labels for the
    # opt-in Resources page (see the `api` service's DockerResources__ProxyUrl comment
    # below and docs/standalone.md) - NOT read by Docker Compose itself. Compose's
    # `depends_on` isn't visible via the Docker API at runtime, so Flare.Api has to author
    # its own relationship data; `flare.role` is a stable cross-orchestrator identity
    # (Aspire's AddFlare() labels its own containers with the same roles, even though the
    # actual container names differ) that `flare.relationships` (below, on ingest/api/
    # dashboard) references instead of container names/IDs.
    labels:
      flare.resource: "true"
      flare.role: "clickhouse"
    environment:
      # The official image's own env var for the "default" user's password - same
      # mechanism Aspire's AddClickHouse resource uses under the hood.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flare}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Same trick as Flare.AppHost's Program.cs: the official image runs every *.sql
      # file here once, in filename order, the first time it starts against an empty
      # data directory. db/clickhouse/0001_logs.sql creates the `clickhousedb`
      # database itself (see that file's own comments for why) - no CLICKHOUSE_DB env
      # var wires that up for you.
      - ./db/clickhouse:/docker-entrypoint-initdb.d:ro
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:latest
    # See clickhouse's identical labels comment above.
    labels:
      flare.resource: "true"
      flare.role: "redis"
    # --save 30 100 mirrors Flare.AppHost's WithPersistence(interval: 30s,
    # keysChangedThreshold: 100) - RDB snapshotting so buffered-but-unflushed log
    # events survive a Redis container restart, not just a Flare.Ingest restart.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-flare}", "--save", "30", "100"]
    environment:
      # Only read by this service's own healthcheck below (redis-cli, inside the
      # container) - the actual password is set via `command:` above.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-flare}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    build:
      context: .
      dockerfile: src/Flare.Ingest/Dockerfile
    # Restarts after a crash or a Docker daemon restart, but (unlike `always`) doesn't
    # fight an explicit `docker compose stop`/`flare stop`. Complementary hardening
    # alongside the identity-migration lock fix (IdentityMigrationRunner's own
    # BEGIN IMMEDIATE) - a safety net for any other unforeseen startup crash, so this
    # container doesn't just sit Exited until someone notices and restarts it by hand.
    restart: unless-stopped
    # flare.relationships references *roles* (clickhouse/redis), not container names/IDs -
    # see clickhouse's labels comment above.
    labels:
      flare.resource: "true"
      flare.role: "ingest"
      flare.relationships: "clickhouse:Reference,redis:Reference"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Connection names must match what Flare.AppHost references onto this project
      # (see its Program.cs) - Flare.Ingest reads these via Aspire's
      # AddClickHouseDataSource/AddRedisClient client integrations regardless of
      # whether Aspire orchestration is actually driving the process.
      ConnectionStrings__clickhousedb: "Host=clickhouse;Port=8123;Database=clickhousedb;Username=default;Password=${CLICKHOUSE_PASSWORD:-flare}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-flare}"
      # Same file `api` below points at (see that service's Identity__DbPath and the
      # shared identity-data volume) - both processes need to resolve to the literal
      # same SQLite file. Ingest only ever reads IngestApiKeys from it (see
      # Flare.Identity/IngestKeys/ remarks) - it never touches Users/Sessions.
      Identity__DbPath: "/data/identity/flare-identity.db"
    volumes:
      - identity-data:/data/identity
    ports:
      - "${FLARE_INGEST_GRPC_PORT:-4317}:4317"
      - "${FLARE_INGEST_HTTP_PORT:-4318}:4318"
    healthcheck:
      # No curl/wget in the mcr.microsoft.com/dotnet/aspnet base image (confirmed -
      # neither is installed) - bash's own /dev/tcp pseudo-device sends a real HTTP/1.1
      # GET against ServiceDefaults' /health endpoint instead of just checking that the
      # port accepts connections, with no extra tooling installed into the image.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4318; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Flare.Api/Dockerfile
    # See ingest's identical restart comment above.
    restart: unless-stopped
    # See ingest's identical labels comment above.
    labels:
      flare.resource: "true"
      flare.role: "api"
      flare.relationships: "clickhouse:Reference,redis:Reference"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__clickhousedb: "Host=clickhouse;Port=8123;Database=clickhousedb;Username=default;Password=${CLICKHOUSE_PASSWORD:-flare}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-flare}"
      # App-wide SMTP server for the alerting Email channel (EmailAlertNotifier /
      # EmailOptions) - unlike CLICKHOUSE_PASSWORD/REDIS_PASSWORD above, these have no
      # working default (there's no sensible default mail server), so they're blank
      # unless set in .env. A rule whose channel is Email just fails per-send with a
      # clear error until these are configured - not a startup requirement.
      Email__Host: "${SMTP_HOST:-}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__Username: "${SMTP_USERNAME:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
      Email__From: "${SMTP_FROM:-}"
      Email__UseStartTls: "${SMTP_USE_STARTTLS:-true}"
      # Same file `ingest` above points at - see its Identity__DbPath comment.
      Identity__DbPath: "/data/identity/flare-identity.db"
      # Must match wherever *your browser* actually loads the dashboard from - same
      # value the dashboard service's own ORIGIN below is computed from, so overriding
      # FLARE_DASHBOARD_PORT (or opening the dashboard from a different host, see that
      # service's comment) keeps both in sync automatically. AllowCredentials() means
      # this can't be a wildcard - the session cookie won't cross origins otherwise.
      Cors__AllowedOrigins__0: "http://localhost:${FLARE_DASHBOARD_PORT:-7777}"
      # Opt-in Resources page (docs/standalone.md) - blank by default, meaning
      # DockerContainerPoller never polls and the page shows a clean "not enabled" state.
      # Turning this on requires TWO explicit `.env` lines, deliberately: this URL (only
      # reachable if `docker-proxy` below is actually running) AND
      # `COMPOSE_PROFILES=resource-graph` (Compose reads this automatically) to start that
      # service - see docs/standalone.md for the full "why" of the read-only socket-proxy
      # this points at instead of ever mounting /var/run/docker.sock into this container.
      DockerResources__ProxyUrl: "${FLARE_DOCKER_PROXY_URL:-}"
    volumes:
      - identity-data:/data/identity
    ports:
      - "${FLARE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    build:
      # Repo root, not ./src/dashboard - the Dockerfile's own codegen stage needs
      # Flare.Api's source (MemoryPack TypeScript codegen, see that Dockerfile's header
      # comment and ADR-0016), same context pattern api/ingest already use below.
      context: .
      dockerfile: src/dashboard/Dockerfile
    # See ingest's identical labels comment above - dashboard only references api
    # (clickhouse/redis are ingest/api's own backing stores, not the dashboard's).
    labels:
      flare.resource: "true"
      flare.role: "dashboard"
      flare.relationships: "api:Reference"
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Must resolve from *your browser*, not from inside this compose network - the
      # dashboard is a client-rendered SPA (src/dashboard/src/lib/api.ts fetches this
      # directly from JS running on your machine), so the in-network service name
      # "api" would not resolve for you. Override in .env if you're opening the
      # dashboard from a different host than the one running `docker compose up`.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      ORIGIN: "http://localhost:${FLARE_DASHBOARD_PORT:-7777}"
    ports:
      - "${FLARE_DASHBOARD_PORT:-7777}:3000"

  # Opt-in, read-only Docker access for the Resources page (`api`'s
  # DockerResources__ProxyUrl above) - see docs/standalone.md for the full security
  # rationale. Gated behind the "resource-graph" Compose profile so it's NEVER started by
  # a bare `docker compose up`, on top of `api`'s own separate opt-in env var: enabling
  # the feature means setting BOTH `COMPOSE_PROFILES=resource-graph` (Compose reads this
  # env var automatically, no --profile flag needed) AND `FLARE_DOCKER_PROXY_URL` in
  # `.env`. CONTAINERS=1 is the proxy's own allowlist mechanism - it scopes this to
  # container list/inspect ONLY (no POST, so no start/stop/create/exec/kill; no image,
  # volume, network, exec, or build endpoints at all) even though the mounted socket
  # itself is otherwise full, unrestricted, effectively-root Docker access. Read-only bind
  # mount and no published host port are both defense in depth on top of that scoping, not
  # a substitute for it.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    profiles: ["resource-graph"]
    labels:
      flare.resource: "true"
      flare.role: "docker-proxy"
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  clickhouse-data:
  redis-data:
  # Embedded SQLite identity store (Users/Sessions/IngestApiKeys) - shared by `ingest`
  # and `api`, both mounting it at the same in-container path. See docs/auth.md for why
  # this is a plain volume-backed file rather than a fourth backing-store service.
  identity-data:
