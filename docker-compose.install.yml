# Image-based counterpart to ../docker-compose.yml, for scripts/install.sh's
# zero-prerequisite quick-install path (docs-internal/planning/roadmap.md's "fourth,
# even-lower-friction entry point"). docker-compose.yml assumes a `git clone` - its
# ingest/api/dashboard services `build:` from local Dockerfiles. This file exists
# because install.sh's whole premise is "no repo cloned, no .NET SDK" - there's nothing
# local to build, so those three services instead `image:` the same builds published by
# .github/workflows/docker-publish.yml to Docker Hub.
#
# Every other line (labels, environment, ports, healthchecks, volumes, depends_on) is
# copied verbatim from docker-compose.yml - this is NOT a different stack, just a
# different way of obtaining the same three container images. Keep the two files in
# sync by hand when either changes; there's no templating between them (same tradeoff
# docker-publish.yml's own header comment makes about copying compose's build stanzas
# verbatim rather than generating them).
#
# install.sh fetches this file (renamed to docker-compose.yml in its install
# directory) plus .env.example and db/clickhouse/*.sql from this repo - it does not
# need a full `git clone`.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    labels:
      flare.resource: "true"
      flare.role: "clickhouse"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flare}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./db/clickhouse:/docker-entrypoint-initdb.d:ro
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:latest
    labels:
      flare.resource: "true"
      flare.role: "redis"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-flare}", "--save", "30", "100"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-flare}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    # DOCKERHUB_USERNAME/FLARE_IMAGE_TAG are install.sh's own env vars (not in
    # .env.example - docker-compose.yml has no equivalent, since it builds locally
    # instead). FLARE_IMAGE_TAG defaults to "latest" - the first stable images were
    # published at v0.1.3 (see .github/workflows/docker-publish.yml); "edge" tracks
    # main instead, for whoever explicitly wants that.
    image: ${DOCKERHUB_USERNAME:-xracer007}/flare-ingest:${FLARE_IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      flare.resource: "true"
      flare.role: "ingest"
      flare.relationships: "clickhouse:Reference,redis:Reference"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__clickhousedb: "Host=clickhouse;Port=8123;Database=clickhousedb;Username=default;Password=${CLICKHOUSE_PASSWORD:-flare}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-flare}"
      Identity__DbPath: "/data/identity/flare-identity.db"
    volumes:
      - identity-data:/data/identity
    ports:
      - "${FLARE_INGEST_GRPC_PORT:-4317}:4317"
      - "${FLARE_INGEST_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4318; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${DOCKERHUB_USERNAME:-xracer007}/flare-api:${FLARE_IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      flare.resource: "true"
      flare.role: "api"
      flare.relationships: "clickhouse:Reference,redis:Reference"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__clickhousedb: "Host=clickhouse;Port=8123;Database=clickhousedb;Username=default;Password=${CLICKHOUSE_PASSWORD:-flare}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-flare}"
      Email__Host: "${SMTP_HOST:-}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__Username: "${SMTP_USERNAME:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
      Email__From: "${SMTP_FROM:-}"
      Email__UseStartTls: "${SMTP_USE_STARTTLS:-true}"
      Identity__DbPath: "/data/identity/flare-identity.db"
      Cors__AllowedOrigins__0: "http://localhost:${FLARE_DASHBOARD_PORT:-7777}"
      DockerResources__ProxyUrl: "${FLARE_DOCKER_PROXY_URL:-}"
    volumes:
      - identity-data:/data/identity
    ports:
      - "${FLARE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    image: ${DOCKERHUB_USERNAME:-xracer007}/flare-dashboard:${FLARE_IMAGE_TAG:-latest}
    labels:
      flare.resource: "true"
      flare.role: "dashboard"
      flare.relationships: "api:Reference"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      ORIGIN: "http://localhost:${FLARE_DASHBOARD_PORT:-7777}"
    ports:
      - "${FLARE_DASHBOARD_PORT:-7777}:3000"

  # Opt-in Resources page proxy - see docker-compose.yml's identical service for the
  # full rationale (ADR-0005). Copied verbatim; it was already image-based.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    profiles: ["resource-graph"]
    labels:
      flare.resource: "true"
      flare.role: "docker-proxy"
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  clickhouse-data:
  redis-data:
  identity-data:
