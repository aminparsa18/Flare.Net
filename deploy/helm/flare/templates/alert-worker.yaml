apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flare.name" . }}-alert-worker
  labels: {{- include "flare.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.alertWorker.replicas }}
  selector:
    matchLabels: {{- include "flare.selector" (dict "Release" .Release "component" "alert-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flare.selector" (dict "Release" .Release "component" "alert-worker") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.alertWorker.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.alertWorker.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: alert-worker
          image: {{ include "flare.image" (dict "root" . "name" "alert-worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "flare.backingEnv" . | nindent 12 }}
            {{- include "flare.smtpEnv" . | nindent 12 }}
            - name: Alerting__PublicUrl
              value: {{ include "flare.dashboardUrl" . | quote }}
            {{- with .Values.alertWorker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- with .Values.alertWorker.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
