apiVersion: v1
kind: Service
metadata:
  name: {{ include "flare.name" . }}-ingest
  labels: {{- include "flare.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ingest.service.type }}
  selector: {{- include "flare.selector" (dict "Release" .Release "component" "ingest") | nindent 4 }}
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: grpc }
    - { name: otlp-http, port: 4318, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flare.name" . }}-ingest
  labels: {{- include "flare.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.replicas }}
  selector:
    matchLabels: {{- include "flare.selector" (dict "Release" .Release "component" "ingest") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flare.selector" (dict "Release" .Release "component" "ingest") | nindent 8 }}
        {{- if eq .Values.identity.provider "Sqlite" }}
        flare.io/identity-store: shared
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "flare.identityAffinity" . | nindent 6 }}
      {{- with .Values.ingest.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingest.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingest
          image: {{ include "flare.image" (dict "root" . "name" "ingest") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: grpc, containerPort: 4317 }
            - { name: http, containerPort: 4318 }
          env:
            {{- include "flare.backingEnv" . | nindent 12 }}
            {{- include "flare.identityEnv" . | nindent 12 }}
            {{- if gt (int .Values.ingest.replicas) 1 }}
            - name: LogPattern__SharedStore
              value: "true"
            {{- end }}
            {{- with .Values.ingest.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- with .Values.ingest.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "flare.identityMount" . | nindent 10 }}
      {{- include "flare.identityVolume" . | nindent 6 }}
