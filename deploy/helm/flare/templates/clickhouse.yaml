{{- if .Values.clickhouse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flare.name" . }}-clickhouse
  labels: {{- include "flare.labels" . | nindent 4 }}
spec:
  selector: {{- include "flare.selector" (dict "Release" .Release "component" "clickhouse") | nindent 4 }}
  ports:
    - { name: http, port: 8123 }
    - { name: native, port: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flare.name" . }}-clickhouse
  labels: {{- include "flare.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "flare.name" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels: {{- include "flare.selector" (dict "Release" .Release "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flare.selector" (dict "Release" .Release "component" "clickhouse") | nindent 8 }}
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flare.clickhouseSecret" . }}
                  key: clickhouse-password
          ports:
            - { name: http, containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- with .Values.clickhouse.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.clickhouse.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
{{- end }}
