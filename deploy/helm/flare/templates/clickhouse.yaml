{{- if .Values.clickhouse.enabled }}
{{- $usersOn := eq (include "flare.clickhouseUsersOn" .) "true" }}
{{- $quota := .Values.clickhouse.queryQuota }}
{{- $quotaOn := and $usersOn (or (gt (int64 $quota.readRows) 0) (gt (int64 $quota.executionTimeSeconds) 0)) }}
{{- if $usersOn }}
# flare_ingest, flare_query and flare_app (ADR-0282). files/flare-users.xml is a copy of
# db/clickhouse/config/flare-users.xml; Flare.Api.Tests fails if the two differ.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flare.name" . }}-clickhouse-users
  labels: {{- include "flare.labels" . | nindent 4 }}
data:
  flare-users.xml: |-
{{ .Files.Get "files/flare-users.xml" | indent 4 }}
  {{- if $quotaOn }}
  # Per-identity hourly caps on flare_query (ADR-0286). Mounted as zz-...: users.d files merge in name order,
  # so it must sort after flare-users.xml, whose quota limits are all 0.
  zz-flare-query-quota.xml: |-
    <clickhouse>
        <quotas>
            <flare_query>
                <interval>
                    <read_rows>{{ int64 $quota.readRows }}</read_rows>
                    <execution_time>{{ int64 $quota.executionTimeSeconds }}</execution_time>
                </interval>
            </flare_query>
        </quotas>
    </clickhouse>
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flare.name" . }}-clickhouse
  labels: {{- include "flare.labels" . | nindent 4 }}
spec:
  selector: {{- include "flare.selector" (dict "Release" .Release "component" "clickhouse") | nindent 4 }}
  ports:
    - { name: http, port: 8123 }
    - { name: native, port: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flare.name" . }}-clickhouse
  labels: {{- include "flare.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "flare.name" . }}-clickhouse
  replicas: 1
  selector:
    matchLabels: {{- include "flare.selector" (dict "Release" .Release "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flare.selector" (dict "Release" .Release "component" "clickhouse") | nindent 8 }}
      {{- if $usersOn }}
      annotations:
        # Restart ClickHouse when the users file changes; users.d is only read at start.
        checksum/flare-users: {{ .Files.Get "files/flare-users.xml" | sha256sum }}
        {{- if $quotaOn }}
        checksum/flare-query-quota: {{ printf "%d/%d" (int64 $quota.readRows) (int64 $quota.executionTimeSeconds) | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flare.clickhouseSecret" . }}
                  key: clickhouse-password
            {{- if $usersOn }}
            {{- range $conn := list "ingest" "query" "app" }}
            - name: FLARE_CH_{{ upper $conn }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flare.secretName" $ }}
                  key: clickhouse-{{ $conn }}-password
            {{- end }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8123 }
            - { name: native, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- with .Values.clickhouse.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            {{- if $usersOn }}
            - { name: flare-users, mountPath: /etc/clickhouse-server/users.d/flare-users.xml, subPath: flare-users.xml, readOnly: true }
            {{- if $quotaOn }}
            - { name: flare-users, mountPath: /etc/clickhouse-server/users.d/zz-flare-query-quota.xml, subPath: zz-flare-query-quota.xml, readOnly: true }
            {{- end }}
            {{- end }}
      {{- if $usersOn }}
      volumes:
        - name: flare-users
          configMap:
            name: {{ include "flare.name" . }}-clickhouse-users
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.clickhouse.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
{{- end }}
