# Generated by the `flare` CLI (Flare.Cli) into ~/.flare/docker-compose.yml on first
# `flare start`. This is the CLI's OWN stack definition, not a copy of Flare.Net's root
# docker-compose.yml - the two differ in exactly two ways, everything else (env vars,
# healthchecks, volumes, labels, the docker-proxy opt-in profile) is kept identical on
# purpose so the two distribution paths stay behaviorally in sync:
#
#   1. ingest/api/dashboard use published `image:` references (xracer007/flare-*), not
#      `build: context: .` - this file has to work from an arbitrary directory on an
#      arbitrary machine with no Flare.Net checkout present, unlike the repo's own file.
#   2. The ClickHouse init scripts bind-mount points at ./db/clickhouse relative to THIS
#      file's own directory (~/.flare/db/clickhouse), materialized from Flare.Cli's
#      embedded resources on first run - not a repo-relative path.
#
# Every other comment below is preserved verbatim from docker-compose.yml for the same
# reasoning to apply here.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    labels:
      flare.resource: "true"
      flare.role: "clickhouse"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flare}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./db/clickhouse:/docker-entrypoint-initdb.d:ro
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:latest
    labels:
      flare.resource: "true"
      flare.role: "redis"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-flare}", "--save", "30", "100"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-flare}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest:
    image: xracer007/flare-ingest:${FLARE_IMAGE_TAG:-edge}
    labels:
      flare.resource: "true"
      flare.role: "ingest"
      flare.relationships: "clickhouse:Reference,redis:Reference"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__clickhousedb: "Host=clickhouse;Port=8123;Database=clickhousedb;Username=default;Password=${CLICKHOUSE_PASSWORD:-flare}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-flare}"
      Identity__DbPath: "/data/identity/flare-identity.db"
    volumes:
      - identity-data:/data/identity
    ports:
      - "${FLARE_INGEST_GRPC_PORT:-4317}:4317"
      - "${FLARE_INGEST_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4318; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: xracer007/flare-api:${FLARE_IMAGE_TAG:-edge}
    labels:
      flare.resource: "true"
      flare.role: "api"
      flare.relationships: "clickhouse:Reference,redis:Reference"
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__clickhousedb: "Host=clickhouse;Port=8123;Database=clickhousedb;Username=default;Password=${CLICKHOUSE_PASSWORD:-flare}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-flare}"
      Email__Host: "${SMTP_HOST:-}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__Username: "${SMTP_USERNAME:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
      Email__From: "${SMTP_FROM:-}"
      Email__UseStartTls: "${SMTP_USE_STARTTLS:-true}"
      Identity__DbPath: "/data/identity/flare-identity.db"
      Cors__AllowedOrigins__0: "http://localhost:${FLARE_DASHBOARD_PORT:-3000}"
      DockerResources__ProxyUrl: "${FLARE_DOCKER_PROXY_URL:-}"
    volumes:
      - identity-data:/data/identity
    ports:
      - "${FLARE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    image: xracer007/flare-dashboard:${FLARE_IMAGE_TAG:-edge}
    labels:
      flare.resource: "true"
      flare.role: "dashboard"
      flare.relationships: "api:Reference"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      ORIGIN: "http://localhost:${FLARE_DASHBOARD_PORT:-3000}"
    ports:
      - "${FLARE_DASHBOARD_PORT:-3000}:3000"

  # Opt-in, read-only Docker access for the Resources page - see docs/standalone.md (and
  # docs/cli.md) for the full security rationale. Gated behind the "resource-graph"
  # Compose profile so it's never started by a bare `flare start`.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    profiles: ["resource-graph"]
    labels:
      flare.resource: "true"
      flare.role: "docker-proxy"
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  clickhouse-data:
  redis-data:
  identity-data:
