# Generated by the `flare` CLI (Flare.Cli) into ~/.flare/docker-compose.yml on first
# `flare start --cluster`. This is the CLI's OWN cluster stack definition, not a copy of
# Flare.Net's root docker-compose.cluster.yml (see docs/clustering.md for the full
# topology/design writeup) - the two differ in exactly two ways, everything else (env
# vars, healthchecks, volumes, labels, dependency graph) is kept identical on purpose so
# the two distribution paths stay behaviorally in sync:
#
#   1. ingest-1/ingest-2/api/dashboard use published `image:` references
#      (xracer007/flare-*), not `build: context: .` - this file has to work from an
#      arbitrary directory on an arbitrary machine with no Flare.Net checkout present,
#      unlike the repo's own file. keeper-*/clickhouse-*/clickhouse-lb/redis already used
#      published images in the root file, so those blocks are unchanged.
#   2. The keeper/ClickHouse config bind-mounts point at ./db/clickhouse-cluster/config
#      relative to THIS file's own directory (~/.flare/db/clickhouse-cluster/config/),
#      materialized from Flare.Cli's embedded resources on first run - not a
#      repo-relative path. No db/clickhouse-cluster/*.sql mount exists in either file -
#      cluster schema is applied entirely by ClickHouseMigrationRunner at app startup
#      (ClickHouse__ClusterMode=true), already embedded inside the ingest/api images.
#
# Every other comment below is preserved verbatim from docker-compose.cluster.yml for the
# same reasoning to apply here. NOT a live migration path from the standalone topology
# (docker-compose.yml/`flare start` without --cluster) - point this at a fresh instance,
# don't try to convert an existing one in place (see FlareHome.EnsureInitialized's own
# mismatch guard, which enforces this).

services:
  keeper-1:
    image: clickhouse/clickhouse-keeper:latest
    labels:
      flare.resource: "true"
      flare.role: "clickhouse-keeper"
    volumes:
      - keeper-1-data:/var/lib/clickhouse-keeper
      - ./db/clickhouse-cluster/config/keeper-1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | clickhouse-keeper-client --host 127.0.0.1 --port 9181 2>/dev/null | grep -q imok || echo mntr | nc -q1 127.0.0.1 9181 | grep -q zk_server_state"]
      interval: 5s
      timeout: 5s
      retries: 30

  keeper-2:
    image: clickhouse/clickhouse-keeper:latest
    labels:
      flare.resource: "true"
      flare.role: "clickhouse-keeper"
    volumes:
      - keeper-2-data:/var/lib/clickhouse-keeper
      - ./db/clickhouse-cluster/config/keeper-2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | clickhouse-keeper-client --host 127.0.0.1 --port 9181 2>/dev/null | grep -q imok || echo mntr | nc -q1 127.0.0.1 9181 | grep -q zk_server_state"]
      interval: 5s
      timeout: 5s
      retries: 30

  keeper-3:
    image: clickhouse/clickhouse-keeper:latest
    labels:
      flare.resource: "true"
      flare.role: "clickhouse-keeper"
    volumes:
      - keeper-3-data:/var/lib/clickhouse-keeper
      - ./db/clickhouse-cluster/config/keeper-3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | clickhouse-keeper-client --host 127.0.0.1 --port 9181 2>/dev/null | grep -q imok || echo mntr | nc -q1 127.0.0.1 9181 | grep -q zk_server_state"]
      interval: 5s
      timeout: 5s
      retries: 30

  # clickhouse-1..4: 2 shards x 2 replicas (shard 1 = clickhouse-1/2, shard 2 =
  # clickhouse-3/4 - see db/clickhouse-cluster/config/remote-servers.xml). No
  # docker-entrypoint-initdb.d mount here (unlike docker-compose.flare.yml's `clickhouse`
  # service): schema application goes through ClickHouseMigrationRunner only (ingest/api's
  # own `ClickHouse__ClusterMode: "true"` below), which is idempotent and safe to run from
  # any node once Keeper is up - running the ON CLUSTER migrations from each node's own
  # first-boot init hook independently would be redundant and timing-sensitive against
  # Keeper's own startup.
  clickhouse-1:
    image: clickhouse/clickhouse-server:latest
    labels:
      flare.resource: "true"
      flare.role: "clickhouse"
    depends_on:
      keeper-1: { condition: service_healthy }
      keeper-2: { condition: service_healthy }
      keeper-3: { condition: service_healthy }
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flare}
    volumes:
      - clickhouse-1-data:/var/lib/clickhouse
      - ./db/clickhouse-cluster/config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./db/clickhouse-cluster/config/use-keeper.xml:/etc/clickhouse-server/config.d/use-keeper.xml:ro
      - ./db/clickhouse-cluster/config/macros-1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse-2:
    image: clickhouse/clickhouse-server:latest
    labels:
      flare.resource: "true"
      flare.role: "clickhouse"
    depends_on:
      keeper-1: { condition: service_healthy }
      keeper-2: { condition: service_healthy }
      keeper-3: { condition: service_healthy }
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flare}
    volumes:
      - clickhouse-2-data:/var/lib/clickhouse
      - ./db/clickhouse-cluster/config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./db/clickhouse-cluster/config/use-keeper.xml:/etc/clickhouse-server/config.d/use-keeper.xml:ro
      - ./db/clickhouse-cluster/config/macros-2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse-3:
    image: clickhouse/clickhouse-server:latest
    labels:
      flare.resource: "true"
      flare.role: "clickhouse"
    depends_on:
      keeper-1: { condition: service_healthy }
      keeper-2: { condition: service_healthy }
      keeper-3: { condition: service_healthy }
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flare}
    volumes:
      - clickhouse-3-data:/var/lib/clickhouse
      - ./db/clickhouse-cluster/config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./db/clickhouse-cluster/config/use-keeper.xml:/etc/clickhouse-server/config.d/use-keeper.xml:ro
      - ./db/clickhouse-cluster/config/macros-3.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse-4:
    image: clickhouse/clickhouse-server:latest
    labels:
      flare.resource: "true"
      flare.role: "clickhouse"
    depends_on:
      keeper-1: { condition: service_healthy }
      keeper-2: { condition: service_healthy }
      keeper-3: { condition: service_healthy }
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flare}
    volumes:
      - clickhouse-4-data:/var/lib/clickhouse
      - ./db/clickhouse-cluster/config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./db/clickhouse-cluster/config/use-keeper.xml:/etc/clickhouse-server/config.d/use-keeper.xml:ro
      - ./db/clickhouse-cluster/config/macros-4.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Single ClickHouse entry point for Flare.Ingest/Flare.Api - round-robins across all
  # 4 nodes with passive failover (see db/clickhouse-cluster/config/nginx-lb.conf).
  clickhouse-lb:
    image: nginx:alpine
    labels:
      flare.resource: "true"
      flare.role: "clickhouse-lb"
      flare.relationships: "clickhouse-1:Reference,clickhouse-2:Reference,clickhouse-3:Reference,clickhouse-4:Reference"
    depends_on:
      clickhouse-1: { condition: service_healthy }
      clickhouse-2: { condition: service_healthy }
      clickhouse-3: { condition: service_healthy }
      clickhouse-4: { condition: service_healthy }
    volumes:
      - ./db/clickhouse-cluster/config/nginx-lb.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:latest
    labels:
      flare.resource: "true"
      flare.role: "redis"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-flare}", "--save", "30", "100"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-flare}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Two Flare.Ingest replicas sharing one Redis Streams consumer group. Distinct host
  # port mappings since OTLP ports aren't proxied - point OTLP clients at whichever
  # replica, or add a load balancer in front for real use.
  ingest-1:
    image: xracer007/flare-ingest:${FLARE_IMAGE_TAG:-edge}
    restart: unless-stopped
    labels:
      flare.resource: "true"
      flare.role: "ingest"
      flare.relationships: "clickhouse-lb:Reference,redis:Reference"
    depends_on:
      clickhouse-lb: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ConnectionStrings__clickhousedb: "Host=clickhouse-lb;Port=8123;Database=clickhousedb;Username=default;Password=${CLICKHOUSE_PASSWORD:-flare}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-flare}"
      ClickHouse__ClusterMode: "true"
      Identity__DbPath: "/data/identity/flare-identity.db"
    volumes:
      - identity-data:/data/identity
    ports:
      - "${FLARE_INGEST_GRPC_PORT:-4317}:4317"
      - "${FLARE_INGEST_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4318; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20

  ingest-2:
    image: xracer007/flare-ingest:${FLARE_IMAGE_TAG:-edge}
    restart: unless-stopped
    labels:
      flare.resource: "true"
      flare.role: "ingest"
      flare.relationships: "clickhouse-lb:Reference,redis:Reference"
    depends_on:
      clickhouse-lb: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ConnectionStrings__clickhousedb: "Host=clickhouse-lb;Port=8123;Database=clickhousedb;Username=default;Password=${CLICKHOUSE_PASSWORD:-flare}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-flare}"
      ClickHouse__ClusterMode: "true"
      Identity__DbPath: "/data/identity/flare-identity.db"
    volumes:
      - identity-data:/data/identity
    ports:
      - "${FLARE_INGEST2_GRPC_PORT:-4319}:4317"
      - "${FLARE_INGEST2_HTTP_PORT:-4320}:4318"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4318; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: xracer007/flare-api:${FLARE_IMAGE_TAG:-edge}
    restart: unless-stopped
    labels:
      flare.resource: "true"
      flare.role: "api"
      flare.relationships: "clickhouse-lb:Reference,redis:Reference"
    depends_on:
      clickhouse-lb: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      ConnectionStrings__clickhousedb: "Host=clickhouse-lb;Port=8123;Database=clickhousedb;Username=default;Password=${CLICKHOUSE_PASSWORD:-flare}"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD:-flare}"
      ClickHouse__ClusterMode: "true"
      Email__Host: "${SMTP_HOST:-}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__Username: "${SMTP_USERNAME:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
      Email__From: "${SMTP_FROM:-}"
      Email__UseStartTls: "${SMTP_USE_STARTTLS:-true}"
      Identity__DbPath: "/data/identity/flare-identity.db"
      Cors__AllowedOrigins__0: "http://localhost:${FLARE_DASHBOARD_PORT:-7777}"
      DockerResources__ProxyUrl: "${FLARE_DOCKER_PROXY_URL:-}"
    volumes:
      - identity-data:/data/identity
    ports:
      - "${FLARE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    image: xracer007/flare-dashboard:${FLARE_IMAGE_TAG:-edge}
    labels:
      flare.resource: "true"
      flare.role: "dashboard"
      flare.relationships: "api:Reference"
    depends_on:
      api: { condition: service_healthy }
    environment:
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      ORIGIN: "http://localhost:${FLARE_DASHBOARD_PORT:-7777}"
    ports:
      - "${FLARE_DASHBOARD_PORT:-7777}:3000"

volumes:
  keeper-1-data:
  keeper-2-data:
  keeper-3-data:
  clickhouse-1-data:
  clickhouse-2-data:
  clickhouse-3-data:
  clickhouse-4-data:
  redis-data:
  identity-data:
