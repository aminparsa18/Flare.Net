<!doctype html>
<!-- No hardcoded class="dark" here - mode-watcher's ModeWatcher (root +layout.svelte)
     injects a synchronous inline script into <head> that sets the correct dark/light
     class before first paint, based on the user's saved choice or system preference.

     The lang attribute below is filled in by hooks.server.ts's paraglideMiddleware with
     the locale it resolved for this request (cookie, then Accept-Language, then "en") -
     keeps <html lang> correct on the very first SSR'd response, not just after
     hydration. Deliberately not spelling out the placeholder token itself in this
     comment - transformPageChunk's replace matches the first occurrence in the whole
     document, and it did match this comment before the real attribute once, below. -->
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<!-- favicon.svg used to be here, but it was the unmodified `create-svelte` scaffold's
		     Svelte-logo placeholder (<title>svelte-logo</title>, still on disk if needed) - not
		     Flare's own mark. These three are the real brand favicons. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
