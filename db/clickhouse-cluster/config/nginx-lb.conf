worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Round-robins across all 4 ClickHouse nodes' HTTP interfaces. Any node is a
    # valid entry point regardless of which shard it physically belongs to - the
    # `Distributed` tables it hosts forward each request to the correct shard/replica
    # internally (see docs/clustering.md "Design decision: Distributed tables keep the
    # plain table names"), so there's no shard-affinity requirement here.
    #
    # Passive health checks give automatic failover: a node that fails 3 requests
    # within 5s is pulled out of rotation for 5s, so a single down node (e.g.
    # clickhouse-1) no longer blocks Flare.Ingest/Flare.Api the way a hardcoded
    # single-node connection string used to (see docs/clustering.md "Known
    # limitations").
    upstream clickhouse_cluster {
        server clickhouse-1:8123 max_fails=3 fail_timeout=5s;
        server clickhouse-2:8123 max_fails=3 fail_timeout=5s;
        server clickhouse-3:8123 max_fails=3 fail_timeout=5s;
        server clickhouse-4:8123 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8123;

        location / {
            proxy_pass http://clickhouse_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;

            # Retry the next upstream (not just fail the client request) on a
            # connect-level error or a 5xx from the node it landed on.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 4;
        }
    }
}
