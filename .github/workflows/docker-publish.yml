# Builds and publishes Flare's three distributable images to Docker Hub under the
# account named by the DOCKERHUB_USERNAME repo variable (currently `xracer007`)
# (Planning.md's "Next — v1.1" roadmap item). This is what an
# eventual `Flare.Hosting.Aspire` package will wrap via AddContainer(...) — see
# Flare.AppHost/Program.cs for the resource graph that package replicates against
# these same images.
#
# Tagging: `edge` on every push to main (nothing stable exists yet - Flare is
# pre-alpha with no versioning scheme), semver tags (+ auto `latest`) on `v*.*.*` git
# tags once a real release happens. push-only (main + tags) deliberately, not also
# pull_request - a PR trigger would run this same build twice for one merge (once to
# validate the PR, again on the push the merge itself produces), doubling CI time for
# no benefit once nothing else in the run differs except the final push-to-Docker-Hub
# step. Dockerfile breakage is instead caught here, after merge, same as any other
# push-only workflow in this repo. Build contexts/dockerfiles below are copied
# verbatim from docker-compose.yml's own `build:` stanzas so this never diverges from
# the already-working local build story.
#
# Per-image selectivity: the top-level `paths:` filter below is just a cheap first
# bail-out (skip the whole workflow for changes entirely outside these trees, e.g. a
# root README.md or docs/ edit). Within a run, the `changes` job then works out which
# of the three images actually need rebuilding from the *specific* files touched
# (ProjectReferences mapped by hand below - Docker itself has no dependency graph to
# ask), so e.g. a docs-only edit under src/Flare.Api/ or a change scoped to
# src/Flare.Ingest/ no longer rebuilds+pushes all three. workflow_dispatch and a
# `v*.*.*` tag push always build all three regardless of diff - a manual run implies
# "rebuild everything", and a release tag should always produce a complete, consistent
# set of images at that version rather than whatever happened to change since the last
# one.

name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'src/Flare.Ingest/**'
      - 'src/Flare.Api/**'
      - 'src/Flare.ServiceDefaults/**'
      - 'src/Flare.Identity/**'
      - 'src/dashboard/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out which of the three images actually need rebuilding. Kept as its own job
  # (rather than an `if:` on each matrix entry) so an unaffected image's job never
  # spins up a runner at all - it just doesn't appear in the matrix below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        # dorny/paths-filter diffs against history locally - full depth keeps that
        # reliable regardless of how the push landed (merge commit, squash, etc.).
        with:
          fetch-depth: 0

      # Skipped for workflow_dispatch/tag pushes - those force-build all three below
      # instead of diffing (a manual run means "rebuild everything", and there's no
      # single meaningful "previous commit" to diff a tag push against anyway).
      # No `!**/*.md` negations here on purpose - with the default `some` (OR)
      # quantifier, dorny/paths-filter evaluates each listed pattern independently, so a
      # negated pattern matches *any* file that isn't under that specific .md path,
      # including files totally unrelated to that filter (confirmed live: it flagged
      # ingest/api/dashboard all `true` for a push that only touched README.md files and
      # an unrelated workflow - see PR discussion). `list-files: json` instead hands the
      # actual matched file list to the next step, which excludes .md changes itself.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          list-files: json
          filters: |
            shared:
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - '.github/workflows/docker-publish.yml'
            ingest:
              - 'src/Flare.Ingest/**'
              - 'src/Flare.ServiceDefaults/**'
              - 'src/Flare.Identity/**'
            api:
              - 'src/Flare.Api/**'
              - 'src/Flare.ServiceDefaults/**'
              - 'src/Flare.Identity/**'
            dashboard:
              - 'src/dashboard/**'
              # The codegen stage builds Flare.Api for its side effect (MemoryPack
              # TypeScript codegen, ADR-0016) - see src/dashboard/Dockerfile - so the
              # dashboard image depends on Flare.Api's source too, not just its own.
              - 'src/Flare.Api/**'
              - 'src/Flare.ServiceDefaults/**'
              - 'src/Flare.Identity/**'

      - name: Determine images to build
        id: images
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
          SHARED: ${{ steps.filter.outputs.shared }}
          INGEST_FILES: ${{ steps.filter.outputs.ingest_files }}
          API_FILES: ${{ steps.filter.outputs.api_files }}
          DASHBOARD_FILES: ${{ steps.filter.outputs.dashboard_files }}
        run: |
          set -euo pipefail
          ingest='{"name":"flare-ingest","context":".","dockerfile":"src/Flare.Ingest/Dockerfile"}'
          api='{"name":"flare-api","context":".","dockerfile":"src/Flare.Api/Dockerfile"}'
          dashboard='{"name":"flare-dashboard","context":".","dockerfile":"src/dashboard/Dockerfile"}'

          if [[ "$FORCE_ALL" == "true" ]]; then
            images=$(jq -c -n --argjson i "$ingest" --argjson a "$api" --argjson d "$dashboard" '[$i,$a,$d]')
            echo "images=$images" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # True only if at least one *non-markdown* file in that filter's matched set
          # changed - a docs-only edit inside a watched directory shouldn't rebuild it.
          # $1 is the filter's `list-files: json` output, e.g. '["src/Flare.Api/README.md"]'.
          has_real_change() {
            jq -e 'any(.[]?; endswith(".md") | not)' >/dev/null 2>&1 <<< "${1:-[]}"
          }

          images='[]'
          if [[ "$SHARED" == "true" ]] || has_real_change "$INGEST_FILES"; then
            images=$(jq -c --argjson x "$ingest" '. + [$x]' <<< "$images")
          fi
          if [[ "$SHARED" == "true" ]] || has_real_change "$API_FILES"; then
            images=$(jq -c --argjson x "$api" '. + [$x]' <<< "$images")
          fi
          if [[ "$SHARED" == "true" ]] || has_real_change "$DASHBOARD_FILES"; then
            images=$(jq -c --argjson x "$dashboard" '. + [$x]' <<< "$images")
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.changes.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # DOCKERHUB_USERNAME is a repo *variable* (Settings > Secrets and variables >
      # Actions > Variables), not a secret - it's not confidential (it's literally
      # part of the public image names below), and keeping it a variable means it
      # prints normally in logs instead of being redacted as *** if a login ever
      # fails and you need to see what was actually sent. DOCKERHUB_TOKEN is the
      # actual credential and must stay a real secret.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest=auto (the action's default) tags `latest` on the highest *non-prerelease*
      # semver tag only, so a throwaway `v0.0.1-test` tag never touches `latest`. The
      # major/major.minor patterns are likewise skipped automatically on prerelease
      # tags - only the exact {{version}} pattern applies to those.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Single-arch (linux/amd64) for now - pre-alpha, no evidence anyone needs arm64
      # yet. Buildx is already wired in above, so adding
      # `platforms: linux/amd64,linux/arm64` later (+ QEMU setup) is a one-line change.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
