name: helm-lint
on:
  pull_request:
    paths: ["deploy/helm/**", ".github/workflows/helm-lint.yml"]
  push:
    branches: [main]
    paths: ["deploy/helm/**"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/flare
      - name: Render every supported topology
        run: |
          c=deploy/helm/flare
          helm template t $c > /dev/null
          helm template t $c --set identity.provider=Postgres --set ingest.replicas=2 > /dev/null
          helm template t $c --set ingress.enabled=true --set publicUrl=https://f.example --set basePath=/flare \
            --set ingress.otlpHttp.enabled=true --set ingress.otlpGrpc.enabled=true > /dev/null
          helm template t $c --set clickhouse.enabled=false --set clickhouse.external.host=ch \
            --set clickhouse.external.clusterMode=true --set redis.enabled=false --set redis.external.host=r > /dev/null
          # One-shot migration Job (ADR-0284), on by default (ADR-0285): only the Job gets the `default` password.
          jobmode() {
            out=$(helm template t $c "$@")
            echo "$out" | grep -q 'name: t-flare-clickhouse-migrate-1'
            [ "$(echo "$out" | grep -c 'name: ConnectionStrings__clickhousedb$')" = 1 ]
          }
          # Startup migrations: no Job, and ingest, api and alert-worker each keep `clickhousedb`.
          startupmode() {
            out=$(helm template t $c "$@")
            # `if`, not `!`: a negated command never trips `bash -e`.
            if echo "$out" | grep -q 'clickhouse-migrate'; then echo "unexpected migration Job: $*"; exit 1; fi
            [ "$(echo "$out" | grep -c 'name: ConnectionStrings__clickhousedb$')" = 3 ]
          }
          jobmode
          jobmode --set image.tag=edge
          jobmode --set image.tag=0.7.0
          jobmode --set clickhouse.enabled=false --set clickhouse.external.host=ch --set clickhouse.external.usersSecret=s
          # Fallbacks: a release older than 0.7.0 has no `migrate` command, and without per-user connection
          # strings the Job would take no credential away.
          startupmode --set image.tag=0.6.0
          startupmode --set image.tag=0.6
          startupmode --set clickhouse.users.enabled=false
          startupmode --set clickhouse.enabled=false --set clickhouse.external.host=ch
          startupmode --set clickhouse.migrationJob.enabled=false
  # Real install on a throwaway kind cluster: catches what lint/template can't (probe paths,
  # startup order, PVC scheduling). Pulls the released images named by the chart, so it runs
  # at the chart's appVersion rather than the PR's code - it validates the chart, not the apps.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
      - name: Install chart
        run: helm install flare deploy/helm/flare -n flare --create-namespace --wait --timeout 10m
      - name: Smoke test
        run: |
          kubectl -n flare port-forward svc/flare-flare-api 8080:8080 &
          kubectl -n flare port-forward svc/flare-flare-ingest 4318:4318 &
          sleep 5
          curl -fsS http://localhost:8080/health
          curl -fsS -X POST http://localhost:4318/v1/logs -H 'content-type: application/json' -d '{"resourceLogs":[]}'
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n flare get pods -o wide
          kubectl -n flare describe pods | tail -80
          kubectl -n flare logs --all-containers --tail=50 -l app.kubernetes.io/instance=flare
