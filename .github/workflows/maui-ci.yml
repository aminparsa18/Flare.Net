# Restores, builds and tests Flare.Maui.slnx on macOS with the MAUI workloads installed.
#
# Separate from ci.yml on purpose: Flare.Maui multi-targets android/ios, which
# only build with the MAUI workloads (and, for iOS, Xcode) on a macOS runner - and macOS
# minutes cost ten times Linux ones. So it runs only when the MAUI project, its tests, or
# this workflow change, and on demand (workflow_dispatch - use it after a repo-wide change to
# Directory.Build.props / Directory.Packages.props / global.json that might affect the mobile targets). Flare.Maui is deliberately outside Flare.slnx
# (ADR-0166), so ci.yml never builds it; this is the signal that the mobile targets compile.
#
# The tests are the plain net11.0 core tests (Flare.Maui.Tests); there is no device or
# emulator here, so the Platform/ glue is only compile-checked.

name: MAUI CI

on:
  push:
    branches: [main]
    paths:
      - 'src/Flare.Maui/**'
      - 'src/Flare.Maui.Tests/**'
      - 'Flare.Maui.slnx'
      - '.github/workflows/maui-ci.yml'
  pull_request:
    paths:
      - 'src/Flare.Maui/**'
      - 'src/Flare.Maui.Tests/**'
      - 'Flare.Maui.slnx'
      - '.github/workflows/maui-ci.yml'
  workflow_dispatch:

concurrency:
  group: maui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # global.json pins the .NET 11 SDK. Its iOS pack (27.2) requires Xcode 27.2, so the runner must have it selected
      # (xcode-select / DEVELOPER_DIR); macos-latest images that only ship Xcode 26.x fail the net11.0-ios build.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: SDK version
        run: dotnet --version

      - name: Restore MAUI workloads
        run: dotnet workload restore Flare.Maui.slnx

      - name: Restore
        run: dotnet restore Flare.Maui.slnx

      # Debug on purpose: Release runs the IL linker over the example app for iOS and Android, which is minutes of
      # work and only checks trimming of code no test exercises. Debug still compiles every target.
      - name: Build
        run: dotnet build Flare.Maui.slnx --no-restore

      - name: Test
        run: dotnet test --solution Flare.Maui.slnx --no-build
