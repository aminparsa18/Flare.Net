# Type-checks, lints, tests and builds the Grafana data source plugin (src/grafana-datasource), frontend and Go backend.
# It has its own package.json and is outside Flare.slnx, so ci.yml never touches it.

name: Grafana plugin CI

on:
  push:
    branches: [main]
    paths:
      - 'src/grafana-datasource/**'
      - '.github/workflows/grafana-plugin.yml'
  pull_request:
    paths:
      - 'src/grafana-datasource/**'
      - '.github/workflows/grafana-plugin.yml'
  workflow_dispatch:

concurrency:
  group: grafana-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/grafana-datasource
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/grafana-datasource/.nvmrc
          cache: npm
          cache-dependency-path: src/grafana-datasource/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/grafana-datasource/go.mod
          cache-dependency-path: src/grafana-datasource/go.sum
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - name: Go format check
        run: test -z "$(gofmt -l pkg Magefile.go)"
      - run: go vet ./pkg/...
      - run: go test -race ./pkg/...
      # The frontend build empties dist/, so the backend is built after it. Linux covers compilation; the release
      # workflow builds every platform.
      - run: go run github.com/magefile/mage -v build:linux
