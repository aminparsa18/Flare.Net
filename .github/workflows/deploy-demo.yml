name: Deploy demo

# The public read-only demo (https://demo.flarenet.live): deploy/demo/docker-compose.yml on a small
# Debian VM. This builds the example shop's image here (not on the VM) and pushes it to GHCR, then
# SSHes to the VM and runs deploy/demo/deploy.sh, which pulls and restarts. Flare's own images come
# from Docker Hub's `edge` tag (docker-publish.yml), so let that run finish first after a merge.
# Setup: deploy/demo/README.md.
#
# Repository secrets (used by the `production` environment):
#   DEMO_SSH_HOST         the VM's address
#   DEMO_SSH_USER         the deploy user on it (in the docker group; owns the repo clone)
#   DEMO_SSH_KEY          private key whose public half is in that user's authorized_keys
#   DEMO_SSH_KNOWN_HOSTS  the VM's host key line(s): ssh-keyscan -t ed25519 <host>
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  shop-image:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image for all eight shop services; each container picks its role from Shop__Role.
      # The .NET SDK builds it without a Dockerfile.
      - name: Build and push the shop image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          dotnet publish examples/ExampleApp.Shop/ExampleApp.Shop.csproj -c Release \
            -t:PublishContainer \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository="$owner/flare-demo-shop" \
            -p:ContainerImageTags="\"latest;${GITHUB_SHA::12}\""

  deploy:
    needs: shop-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_demo
          chmod 600 ~/.ssh/id_demo
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_demo -o StrictHostKeyChecking=yes "$TARGET" 'bash -s' < deploy/demo/deploy.sh
