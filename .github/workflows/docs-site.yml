name: Docs site

# Builds the docfx documentation site from docs/ (all four languages) via
# scripts/build-docs-site.py. Pull requests only build it, with docfx warnings as errors
# (broken links or anchors, a translated index that doesn't list every page); pushes to
# main also deploy it to GitHub Pages (Settings > Pages > Source: GitHub Actions).

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build-docs-site.py', 'dotnet-tools.json', 'global.json', 'src/dashboard/static/logo.png', 'src/dashboard/static/favicon.ico', '.github/workflows/docs-site.yml']
  pull_request:
    paths: ['docs/**', 'scripts/build-docs-site.py', 'dotnet-tools.json', 'global.json', 'src/dashboard/static/logo.png', 'src/dashboard/static/favicon.ico', '.github/workflows/docs-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: each page shows the date its source file last changed

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore docfx
        run: dotnet tool restore

      - name: Build site
        run: python3 scripts/build-docs-site.py --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/docs-site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
